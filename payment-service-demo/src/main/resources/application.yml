spring:
  application:
    name: payment-service-demo   # governance-audit's serviceName resolves from this automatically

  datasource:
    url: jdbc:h2:mem:paymentdemo;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # every module's own /actuator/<id> policy endpoint - safe to expose,
        # each one deliberately withholds secret material (see each module's README)
        include: health,info,governance,governanceAudit,governanceHttpLogging,appResponse,securityEncryption,securityAuth,securityRbac,exchangeAuth

# =====================================================================
# governance-core - shared correlation-id/actor propagation + masking
# =====================================================================
governance:
  core:
    correlation-id-header: X-Correlation-Id
    actor-header: X-User-Id       # overridden at runtime by security-auth once a JWT validates
    mask-sensitive-data: true

  # ===================================================================
  # governance-audit - @Auditable business-action trail
  # ===================================================================
  audit:
    enabled: true
    sink: LOG
    service-name: PAY-SERVICE     # optional override; would otherwise resolve from spring.application.name
    async:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 500

  # ===================================================================
  # governance-http-logging - HTTP request/response access logging
  # ===================================================================
  http-logging:
    enabled: true
    include-headers: true
    include-body: true           # keep off - see governance-http-logging's README before enabling
    include-params: true          # query string + request params captured and masked by name (default)
    sample-rate: 1.0
    async: true                   # default - publishing doesn't block the response

# =====================================================================
# governance-app-response - ServiceID-Type-EventCode + AppResponse<T>
# =====================================================================
application:
  response:
    enabled: true
    service-id: PAY                # REQUIRED - exactly 3 alphanumeric chars
    success-event-code: "0000"
    default-system-event-code: "9999"

# =====================================================================
# security-crypto - AES-GCM field encryption + @EncryptedAPI
# =====================================================================
ssecurity:
  crypto:
    enabled: true
    default-key-id: "primary-key"
    key-env-prefix: "APP_ENCRYPTION_KEY_"
    keys:
      - "c2VjcmV0S2V5T25lMTIzNDU2Nzg5MDEyMzQ1Njc4OTA="
      - "c2VjcmV0S2V5VHdvMTIzNDU2Nzg5MDEyMzQ1Njc4OTA="
    encrypted-api:
      enabled: true
      header-name: "X-Payload-Encrypted"
      header-true-value: "true"
      payload-field-name: "data"

  # ===================================================================
  # security-auth - JWT validation, populates Spring Security's context
  # ===================================================================
  auth:
    hmac-secret: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="   # DEMO ONLY - shared secret with whatever issues tokens
    issuer: payment-service-demo
    roles-claim: roles
    reject-invalid-token: true

  # ===================================================================
  # security-rbac - @RequiresRole/@RequiresPermission
  # ===================================================================
  rbac:
    deny-by-default: true
    role-permissions:
      PAYMENT_ADMIN:
        - payment:read
        - payment:approve
        - payment:transfer
      PAYMENT_VIEWER:
        - payment:read

# =====================================================================
# security-auth-ms-exchange - Entra ID / Exchange Online OAuth2
# =====================================================================
exchange:
  auth:
    enabled: true
    tenant-id: "11111111-2222-3333-4444-555555555555"   # DEMO ONLY - replace with your real tenant id
    client-id: "66666666-7777-8888-9999-000000000000"   # DEMO ONLY - replace with your app registration's client id
    client-secret: "${EXCHANGE_CLIENT_SECRET:demo-secret-not-real}"
    scopes:
      - "https://graph.microsoft.com/.default"
    cache-enabled: true
    validation:
      expected-audience: "api://66666666-7777-8888-9999-000000000000"

logging:
  level:
    AUDIT: INFO
    HTTP_ACCESS: INFO
